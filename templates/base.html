<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}사무실 공구함 — 사무직을 위한 무료 온라인 문서 도구 모음 (OFFICE TOOLBOX){% endblock %}</title>
<meta name="description" content="{% block description %}PDF 압축, 이미지 압축 등 사무직에서 자주 쓰는 문서 도구를 한 곳에서. 설치 없이 무료로 바로 사용하세요. (Office Toolbox for professionals)">{% endblock %}
<link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}">
<meta property="og:title" content="{% block og_title %}사무실 공구함 — OFFICE TOOLBOX{% endblock %}">
<meta property="og:description" content="{% block og_description %}사무직 필수 온라인 문서 도구 모음{% endblock %}">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8602848692420724" crossorigin="anonymous"></script>
<!-- TODO: 배포 후 실제 GA4 값으로 교체 -->
</head>
<body data-page="{{ page }}">
<script src="{{ url_for('static', filename='js/otx-storage.js') }}"></script>
<script>
  (function () {
    var NON_TOOL_PAGES = ["home", "about", "privacy", "terms"];
    var page = document.body.dataset.page;
    if (page && NON_TOOL_PAGES.indexOf(page) === -1 && window.OTX) {
      window.OTX.recordRecent(page);
    }
  })();
</script>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="{{ url_for('home') }}">사무실<span> 공구함</span></a>
    <p class="tagline">OFFICE TOOLBOX — 업무 중 필요한 작은 도구를 한곳에.</p>
    <nav class="nav">
      <a href="{{ url_for('home') }}#tools">전체 도구</a>
      <a href="{{ url_for('home') }}#pdf">PDF</a>
      <a href="{{ url_for('home') }}#image">이미지</a>
      <a href="{{ url_for('home') }}#text">텍스트·데이터</a>
      <a href="{{ url_for('home') }}#calculator">계산기</a>
      <a href="{{ url_for('about') }}">소개</a>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p>&copy; 2026 사무실 공구함</p>
    <div class="footer-links">
      <a href="{{ url_for('about') }}">소개</a>
      <a href="{{ url_for('privacy') }}">개인정보처리방침</a>
      <a href="{{ url_for('terms') }}">이용약관</a>
    </div>
  </div>
  <p class="footer-brand">Crafted by <a href="https://lichtbringer.online/" target="_blank" rel="noopener">Lichtbringer</a></p>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
