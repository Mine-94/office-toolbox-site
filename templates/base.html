<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="naver-site-verification" content="31e2c775dc5074fea5c7f5fdc7aa61a51caadf1c" />
<title>{% block title %}업무 도구함 — 한국 업무를 위한 무료 온라인 실무 도구 (OFFICE TOOLBOX){% endblock %}</title>
<meta name="description" content="{% block description %}PDF·이미지·텍스트 작업부터 사업자조회·업무 계산까지. 한국 업무에서 자주 필요한 온라인 도구를 설치와 회원가입 없이 바로 사용하세요.{% endblock %}">
<link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}">
<meta property="og:title" content="{% block og_title %}업무 도구함 — OFFICE TOOLBOX{% endblock %}">
<meta property="og:description" content="{% block og_description %}업무에 필요한 작은 도구를 한곳에.{% endblock %}">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block styles %}{% endblock %}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8602848692420724" crossorigin="anonymous"></script>
<!-- TODO: 배포 후 실제 GA4 값으로 교체 -->
</head>
<body data-page="{{ page }}">
<script src="{{ url_for('static', filename='js/otx-storage.js') }}"></script>
<script>
  (function () {
    var NON_TOOL_PAGES = ["home", "about", "privacy", "terms"];
    var page = document.body.dataset.page;
    if (page && NON_TOOL_PAGES.indexOf(page) === -1 && window.OTX) {
      window.OTX.recordRecent(page);
    }
  })();
</script>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="{{ url_for('home') }}">업무<span> 도구함</span></a>
    <p class="tagline">OFFICE TOOLBOX — 업무에 필요한 작은 도구를 한곳에.</p>
    <nav class="nav">
      <a href="{{ url_for('home') }}#tools">전체 도구</a>
      <a href="{{ url_for('home') }}#pdf">PDF</a>
      <a href="{{ url_for('home') }}#image">이미지</a>
      <a href="{{ url_for('home') }}#text">텍스트·데이터</a>
      <a href="{{ url_for('home') }}#calculator">계산기</a>
      <a href="{{ url_for('home') }}#business">사업자·경리</a>
      <a href="{{ url_for('about') }}">소개</a>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p>&copy; 2026 업무 도구함</p>
    <div class="footer-links">
      <a href="{{ url_for('about') }}">소개</a>
      <a href="{{ url_for('privacy') }}">개인정보처리방침</a>
      <a href="{{ url_for('terms') }}">이용약관</a>
    </div>
  </div>
  <p class="footer-brand">Crafted by <a href="https://lichtbringer.online/" target="_blank" rel="noopener">Lichtbringer</a></p>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
